name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The old-vs-new parity tests build grimora.cs and mcp.cs from a fixed older commit
          # (tests/Grimora.TestSupport: OldVsNewCli, McpSnapshotHarness); a shallow clone lacks it.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # Pinned to global.json's exact SDK, not a floating '10.0.x': a different feature band
          # names a file-based app's generated project "grimora.cs" instead of "grimora", which slips
          # past Directory.Build.props's file-based-app guard and NU1008s on central package
          # management (see Directory.Build.props and the fix commit for the full story).
          global-json-file: global.json

      - name: Build CLI
        # bin-cli/ is the published Grimora.Cli, the thin client of the server's POST /cli.
        run: ./build-cli.sh

      - name: Build server
        run: ./build-server.sh

      - name: Build MCP server
        run: ./build-mcp.sh

      # the owner, 2026-09-26: the code style "must be enforced by rules". A file the fixer would rewrite fails CI.
      - name: Code style
        run: dotnet format style Grimora.sln --severity info --diagnostics IDE0005 IDE0008 IDE0028 IDE0090 IDE0300 IDE0301 IDE0305 IDE0370 --verify-no-changes

      # the owner, 2026-09-27: every warning Rider shows must fail the build. Rider's inspections are not Roslyn
      # analyzers, so JetBrains' inspectcode (pinned in .config/dotnet-tools.json) runs against Grimora.sln.DotSettings.
      - name: Rider inspections
        run: |
          dotnet build Grimora.sln -c Debug --nologo -v q
          ./inspect.sh

      - name: Solution tests
        run: dotnet test Grimora.sln -c Release

      - name: Cold start on a scratch instance
        run: dotnet bin-cli/grimora.dll init --full --root "$GITHUB_WORKSPACE" --instance ci-init --skip-chat

      - name: Vulnerable dependencies
        run: |
          dotnet list grimora.csproj package --vulnerable --include-transitive 2>&1 | tee audit.txt
          dotnet list mcp.csproj package --vulnerable --include-transitive 2>&1 | tee -a audit.txt
          if grep -qiE '\bHigh\b|\bCritical\b' audit.txt; then
            echo "::error::high or critical advisory in the dependency tree"
            exit 1
          fi
