name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Pinned to global.json's exact SDK — see ci.yml for why a floating '10.0.x' is unsafe here.
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # The plugin manifest is what users install against, so a tag that disagrees with it ships a
      # version nobody can reference. Fail here rather than publish the mismatch.
      - name: Version matches the plugin manifest
        run: |
          manifest=$(node -p "require('./.claude-plugin/plugin.json').version")
          tag="${{ steps.tag.outputs.value }}"
          if [ "v$manifest" != "$tag" ]; then
            echo "::error::tag $tag does not match plugin.json version $manifest"
            exit 1
          fi

      - name: Build
        run: |
          dotnet build aitm.cs -c Release -o bin-cli
          dotnet build mcp.cs -c Release -o bin

      - name: Parse hooks
        run: for f in *.mjs; do node --check "$f" || exit 1; done

      - name: Package
        run: |
          tar -czf aitm-cli-${{ steps.tag.outputs.value }}.tar.gz bin-cli
          tar -czf aitm-mcp-${{ steps.tag.outputs.value }}.tar.gz bin

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            aitm-cli-${{ steps.tag.outputs.value }}.tar.gz
            aitm-mcp-${{ steps.tag.outputs.value }}.tar.gz
